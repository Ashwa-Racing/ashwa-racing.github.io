<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blog | Ashwa Racing</title>
  <meta name="description"
    content="News, engineering stories, competition updates, and technical insights from Ashwa Racing.">

  <link rel="canonical" href="https://ashwaracing.org/blog">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ashwa Racing">
  <meta property="og:title" content="Blog | Ashwa Racing">
  <meta property="og:description" content="News, engineering stories, competition updates, and technical insights from Ashwa Racing.">
  <meta property="og:url" content="https://ashwaracing.org/blog">
  <meta property="og:image" content="https://assets.ashwaracing.org/images/favicon/header.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog | Ashwa Racing">
  <meta name="twitter:description" content="News, engineering stories, competition updates, and technical insights from Ashwa Racing.">
  <meta name="twitter:image" content="https://assets.ashwaracing.org/images/favicon/header.png">

  <link rel="icon" href="https://assets.ashwaracing.org/images/favicon/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="https://assets.ashwaracing.org/images/favicon/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://assets.ashwaracing.org">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">

  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("ashwa-theme"); } catch (error) {}
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    })();
  </script>

  <link rel="stylesheet" href="assets/css/components/loader.css">
  <link rel="stylesheet" href="assets/css/components/base.css">
  <link rel="stylesheet" href="assets/css/components/header.css?v=4">
  <link rel="stylesheet" href="assets/css/pages/blog.css">
  <link rel="stylesheet" href="assets/css/components/footer.css">
</head>

<body class="blog-page">

  <div id="main-header"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z" /></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
  </button>

  <main>
    <section class="blog-hero" aria-labelledby="blog-title">
      <div class="blog-hero-inner">
        <p class="blog-eyebrow">Ashwa Racing · RVCE</p>
        <h1 id="blog-title">Ashwa <em>Blog</em></h1>
        <p class="blog-intro">
          Engineering, competition, projects, and stories from Ashwa Racing.
        </p>
      </div>
    </section>

    <section class="blog-content" aria-label="Blog articles">
      <div class="blog-wrap">

        <div class="blog-featured" id="blog-featured">
          <!-- Populated by blog.js -->
        </div>

        <div class="blog-toolbar">
          <p class="blog-toolbar-label">Stories from the team</p>
          <div class="blog-filter" id="blog-filter" aria-label="Filter articles">
            <!-- Populated by blog.js -->
          </div>
        </div>

        <div class="blog-grid" id="blog-grid">
          <!-- Populated by blog.js -->
        </div>

        <div class="blog-empty" id="blog-empty" hidden>
          <h2>No articles yet.</h2>
          <p>We’re preparing stories from the workshop, the track, and everything in between. Check back soon.</p>
        </div>

      </div>
    </section>
  </main>

  <footer id="main-footer"></footer>

  <div id="site-loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-brand">
        <span class="loader-ashwa">Ashwa</span>
        <span class="loader-racing">Racing</span>
      </div>
      <div class="loader-sponsor">
        <div class="loader-sponsor-tier" id="loader-sponsor-tier">INITIALIZING</div>
        <div class="loader-sponsor-grid" id="loader-sponsor-grid"></div>
      </div>
      <div class="loader-progress"><span class="loader-progress-bar"></span></div>
      <div class="loader-meta"><span id="loader-status">INITIALIZING</span><span id="loader-percent">00%</span></div>
    </div>
  </div>

  <script src="assets/js/pages/blog.js" defer></script>
  <script src="assets/js/components/header.js?v=4" defer></script>
  <script src="assets/js/components/theme.js" defer></script>
  <script src="assets/js/components/loader.js" defer></script>

</body>

</html>
