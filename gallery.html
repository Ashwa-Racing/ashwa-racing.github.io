<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Ashwa Racing</title>

  <link rel="canonical" href="https://ashwaracing.org/gallery" />

  <meta name="description"
    content="Explore the Ashwa Racing gallery featuring Formula Student race cars, workshop builds, competition highlights, and the engineering journey behind two decades of motorsport innovation." />

  <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ashwa Racing">
  <link rel="manifest" href="assets/images/favicon/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/solid.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/fontawesome.min.css">

  <link rel="stylesheet" href="assets/css/components/header.css?v=2">
  <link rel="stylesheet" href="assets/css/components/footer.css">
  <link rel="stylesheet" href="assets/css/pages/gallery.css">
</head>

<body>

  <div id="main-header"></div>

  <!-- HERO -->
  <section class="gallery-hero">
    <div class="gallery-hero__content hero-reveal">
      <div class="gallery-hero__eyebrow">Visual Archive</div>
      <h1 class="gallery-hero__title">Gallery</h1>
      <p class="gallery-hero__sub">Engineering moments. Competition intensity. Precision in motion.</p>

      <div class="gallery-hero__chips" aria-label="Gallery categories">
        <span class="gallery-hero__chip">Cars</span>
        <span class="gallery-hero__chip">Competition</span>
        <span class="gallery-hero__chip">Workshop</span>
        <span class="gallery-hero__chip">Team</span>
      </div>

      <div class="gallery-hero__meta">
        <div class="gallery-hero__meta-item">
          <span class="gallery-hero__meta-label">Focus</span>
          <span>Formula Student engineering and track moments.</span>
        </div>
        <div class="gallery-hero__meta-item">
          <span class="gallery-hero__meta-label">Scope</span>
          <span>Build, test, compete, and celebrate together.</span>
        </div>
      </div>
    </div>

    <div class="gallery-hero__collage hero-reveal" aria-hidden="true">
      <figure class="collage-card is-primary is-float">
        <img src="https://assets.ashwaracing.org/images/gallery/XX6C.webp"
          data-fallback="assets/images/gallery/XX6C.webp" alt="" loading="eager" decoding="async">
        <figcaption>RZ-XX6C</figcaption>
      </figure>
      <figure class="collage-card is-secondary is-float-alt">
        <img src="https://assets.ashwaracing.org/images/gallery/IMG_3970_Original.webp"
          data-fallback="assets/images/gallery/IMG_3970_Original.webp" alt="" loading="eager" decoding="async">
        <figcaption>Endurance</figcaption>
      </figure>
      <figure class="collage-card is-tertiary is-float">
        <img src="https://assets.ashwaracing.org/images/gallery/DSC_0698.webp"
          data-fallback="assets/images/gallery/DSC_0698.webp" alt="" loading="eager" decoding="async">
        <figcaption>Workshop</figcaption>
      </figure>
    </div>
  </section>

  <!-- GALLERY SECTIONS (JS populates) -->
  <section class="gallery-section" id="gallery"></section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lb-backdrop" id="lbBackdrop"></div>

    <button class="lb-close" id="lbClose" aria-label="Close lightbox">
      <i class="fas fa-times"></i>
    </button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">
      <i class="fas fa-chevron-right"></i>
    </button>

    <div class="lb-inner">
      <img class="lb-img" id="lbImg" src="" alt="">
      <div class="lb-footer">
        <span class="lb-counter" id="lbCounter"></span>
        <div class="lb-caption">
          <h3 id="lbTitle"></h3>
          <p id="lbDesc"></p>
        </div>
      </div>
    </div>
  </div>

  <footer id="main-footer"></footer>

  <script src="assets/js/components/header.js"></script>
  <script src="assets/js/pages/gallery.js"></script>
</body>

</html>
