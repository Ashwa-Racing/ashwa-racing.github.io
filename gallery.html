  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("ashwa-theme"); } catch (error) {}
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    })();
  </script>
  <link rel="stylesheet" href="assets/css/components/loader.css">
  <link rel="stylesheet" href="assets/css/components/base.css">
  <link rel="stylesheet" href="assets/css/components/header.css?v=5">
  <link rel="stylesheet" href="assets/css/components/footer.css">
  <link rel="stylesheet" href="assets/css/pages/gallery.css">
</head>

<body class="gallery-page">

  <div id="main-header"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z" /></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
  </button>

  <main>
  <!-- HERO -->
  <section class="gallery-hero">
    <div class="gallery-hero__content hero-reveal">
      <div class="gallery-hero__eyebrow">Ashwa Racing · RVCE</div>
      <h1 class="gallery-hero__title">Ashwa<br><em>in motion.</em></h1>
      <p class="gallery-hero__sub">A walk through Ashwa’s rich tapestry—years of craft, grit, and speed, woven together one moment at a time.</p>
    </div>

    <div class="gallery-hero-media hero-reveal" aria-hidden="true">
      <img id="gallery-hero-image" src="https://assets.ashwaracing.org/images/gallery/XX6C.webp" alt="" fetchpriority="high" decoding="async">
    </div>
  </section>

  <!-- GALLERY SECTIONS (JS populates) -->
  <section class="gallery-section" id="gallery" aria-label="Random photos from the Ashwa Racing archive"></section>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer">
    <div class="lb-backdrop" id="lbBackdrop"></div>

    <button class="lb-close" id="lbClose" aria-label="Close lightbox">
      <i class="fas fa-times"></i>
    </button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">
      <i class="fas fa-chevron-right"></i>
    </button>

    <div class="lb-inner">
      <img class="lb-img" id="lbImg" src="" alt="">
      <div class="lb-footer">
        <span class="lb-counter" id="lbCounter"></span>
        <div class="lb-caption">
          <h3 id="lbTitle"></h3>
          <p id="lbDesc"></p>
        </div>
      </div>
    </div>
  </div>

  <footer id="main-footer"></footer>

  <div id="site-loader" aria-hidden="true">
    <div class="loader-inner"><div class="loader-brand"><span class="loader-ashwa">Ashwa</span><span class="loader-racing">Racing</span></div><div class="loader-sponsor"><div class="loader-sponsor-tier" id="loader-sponsor-tier">INITIALIZING</div><div class="loader-sponsor-grid" id="loader-sponsor-grid"></div></div><div class="loader-progress"><span class="loader-progress-bar"></span></div><div class="loader-meta"><span id="loader-status">INITIALIZING</span><span id="loader-percent">00%</span></div></div>
  </div>

  <script src="assets/js/components/header.js?v=7" defer></script>
  <script src="assets/js/pages/gallery.js" defer></script>
  <script src="assets/js/components/theme.js" defer></script>
  <script src="assets/js/components/loader.js" defer></script>
</body>

</html>
