<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars & Projects | Ashwa Racing</title>

  <link rel="canonical" href="https://ashwaracing.org/projects" />

  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("ashwa-theme"); } catch (e) {}
      document.documentElement.dataset.theme =
        theme === "light" ? "light" : "dark";
    })();
  </script>

  <meta name="description" content="Explore the cars and engineering projects built by Ashwa Racing over the years." />

  <link rel="icon" href="https://assets.ashwaracing.org/images/favicon/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="https://assets.ashwaracing.org/images/favicon/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://assets.ashwaracing.org">
  <link rel="preload" as="image" href="https://assets.ashwaracing.org/cdn-cgi/image/width=1100,format=auto,quality=80/images/prototypes/Prototypes%20Banner.png" media="(max-width: 768px)" fetchpriority="high">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;500&display=swap"></noscript>

  <link rel="stylesheet" href="assets/css/components/base.css">
  <link rel="stylesheet" href="assets/css/components/header.css?v=5">
  <link rel="stylesheet" href="assets/css/components/footer.css?v=2">
  <link rel="stylesheet" href="assets/css/pages/projects.css?v=5">

  <link rel="preload" as="fetch" href="/assets/data/projects.json" crossorigin>
</head>

<body>

  <div id="main-header"></div>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z" />
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
  </button>

  <main id="main-content">

  <!-- ═══════════════════════════
       HERO
  ════════════════════════════ -->
  <section class="garage-heading" aria-labelledby="garage-heading-title">
    <div class="container garage-heading-inner">
      <div>
        <p class="garage-eyebrow"><span></span> ASHWA RACING · RVCE BENGALURU</p>
        <h1 id="garage-heading-title">Cars &amp; <em>Projects</em></h1>
      </div>
      <p>From combustion and hybrid race cars to our first EV and Hyperloop pod, explore the engineering that keeps Ashwa moving forward.</p>
    </div>
  </section>

  <!-- ═══════════════════════════
       PROGRAMME INDEX
  ════════════════════════════ -->
  <section class="projects-explorer" aria-label="Ashwa Racing project archive">
    <aside class="garage-sidebar">
      <nav class="garage-nav" id="prog-index-list" aria-label="Vehicle programmes"></nav>
    </aside>

  <!-- ═══════════════════════════
       PROGRAMME VIEWER
  ════════════════════════════ -->
  <section class="prog-viewer" id="prog-viewer" aria-live="polite">

    <!-- Identity bar -->
    <div class="prog-identity" id="prog-identity">

      <!-- Large background watermark code -->
      <div class="prog-code-bg" id="prog-code-bg" aria-hidden="true"></div>

      <div class="prog-identity-inner container">
        <div class="prog-identity-left">
          <div class="prog-code" id="prog-code">CV</div>
          <div class="prog-identity-text">
            <div class="prog-tag" id="prog-tag">Combustion Vehicle</div>
            <h2 class="prog-title" id="prog-title"></h2>
          </div>
        </div>

      </div>
    </div>

    <!-- Main split: image + content -->
    <div class="prog-split">

      <!-- Left: image panel -->
      <div class="prog-image-panel" id="prog-image-wrap" role="region" aria-roledescription="carousel" aria-label="Project photos" tabindex="0">
        <div class="prog-image-accent" id="prog-image-accent"></div>
        <img id="prog-image" src="" alt="" loading="lazy" draggable="false" tabindex="0" aria-label="Open project photo at full size">
        <div class="prog-image-overlay"></div>

        <div class="prog-photo-loading" id="prog-photo-loading" role="status" aria-live="polite" hidden>
          <span class="prog-photo-spinner" aria-hidden="true"></span>
          <span id="prog-photo-loading-text">Loading project photo</span>
        </div>

        <div class="prog-photo-controls">
          <div class="prog-photo-meta">
            <div class="prog-slide-counter" id="prog-slide-counter" aria-label="Photo number">
              <span id="slide-current">01</span>
              <span class="slide-sep">/</span>
              <span id="slide-total">01</span>
            </div>
            <span class="prog-photo-status" id="prog-photo-status" aria-live="polite"></span>
          </div>
          <div class="prog-carousel-dots" id="prog-carousel-dots" aria-label="Choose a project photo" hidden></div>
          <span class="prog-carousel-hint" id="prog-carousel-hint" hidden>Swipe or drag to explore</span>
        </div>

        <!-- Year badge overlaid on image -->
      </div>

      <dialog class="project-image-dialog" id="project-image-dialog" aria-label="Expanded project photo">
        <button class="project-image-dialog-close" id="project-image-dialog-close" type="button" aria-label="Close expanded photo">×</button>
        <img id="project-image-large" alt="">
      </dialog>

      <!-- Right: content panel -->
      <div class="prog-content" id="prog-content">
        <!-- Injected by JS -->
      </div>

    </div>

  </section>
  </section>


  </main>

  <footer id="main-footer"></footer>

  <script src="assets/js/components/theme.js" defer></script>
  <script src="assets/js/components/utils.js" defer></script>
  <script src="assets/js/pages/projects.js?v=7" defer></script>
  <script src="assets/js/components/header.js?v=7" defer></script>
</body>
</html>
